name: Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security check
        run: npm audit --audit-level=high
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
  size:
    name: Check Size
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
      - run: npm ci
      - run: npm run size
  lint:
    name: Lint Code Base
    runs-on: ubuntu-slim
    needs: commitlint
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
      - run: npm ci
      - run: npm run check
  test:
    name: Testing
    needs:
      - audit
      - commitlint
      - lint
      - size
    strategy:
      fail-fast: false
      matrix:
        version: ['22.18', '24.11', '26', latest]
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-24.04-arm,
            ubuntu-26.04-arm,
            macos-15-intel,
            macos-26-intel,
            macos-15,
            macos-26,
            macos-latest,
            windows-2025,
            windows-11-arm,
            windows-latest
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testing with Node ${{ matrix.version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
      - run: npm ci
      - run: npm run coverage
