name: Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm clean-install
      - name: Security check
        run: npm audit --audit-level=high
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
  size:
    name: Check Size
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
      - run: npm clean-install
      - run: npm run size
  lint:
    name: Lint Code Base
    runs-on: ubuntu-slim
    needs: commitlint
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
      - run: npm clean-install
      - run: npm run check
  test:
    name: Testing
    needs:
      - audit
      - commitlint
      - lint
      - size
    strategy:
      fail-fast: false
      matrix:
        version: ['22.18', '24', '26', current, lts/*, latest]
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-22.04-arm,
            ubuntu-24.04-arm,
            ubuntu-26.04-arm,
            macos-15-intel,
            macos-26-intel,
            macos-14,
            macos-15,
            macos-26,
            macos-latest,
            xcode-27,
            windows-2022,
            windows-2025,
            windows-11-arm,
            windows-latest,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testing with Node ${{ matrix.version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
      - run: npm clean-install
      - run: npm run coverage
